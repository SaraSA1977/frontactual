<ng-container *ngIf="esLogin">
  <router-outlet></router-outlet>
</ng-container>

<div class="layout" *ngIf="!esLogin">

  <div class="header">

    <div class="logo">
      <img src="images/logovademecum.png" alt="Logo Vademécum">
    </div>

    <div class="page-title">{{ tituloPagina }}</div>

    <div class="user-menu" (click)="toggleUserMenu()">
      👤 {{ usuarioActual?.full_name || usuarioActual?.nombre || 'Mi cuenta' }}

      <div class="dropdown" *ngIf="menuUsuarioAbierto">
        <div (click)="navegar('/profile')">Perfil</div>
        <hr style="margin: 0; border: 0.5px solid #eee;">
        <div (click)="cerrarSesion()" style="color: #d9534f;">⏻ Cerrar sesión</div>
      </div>
    </div>

  </div>

  <div class="body-row">

    <div class="sidebar" [class.abierto]="menuAbierto()">

      <div class="menu-icon" (click)="toggleMenu()">☰</div>

      <ul class="menu-list" *ngIf="menuAbierto()">

        <li 
          routerLink="/home"
          routerLinkActive="active-link">
          🏠︎ Home
        </li>

        <li 
          routerLink="/products"
          routerLinkActive="active-link">
          🫙 Productos
        </li>

        <li 
          routerLink="/dashboard"
          routerLinkActive="active-link">
          📈 Dashboard
        </li>

        <li 
          routerLink="/foro"
          routerLinkActive="active-link">
          💭 Foro
        </li>

        <li 
          *ngIf="esAdmin()"
          routerLink="/users"
          routerLinkActive="active-link">
          👥 Usuarios
        </li>
        
      </ul>

    </div>

    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
